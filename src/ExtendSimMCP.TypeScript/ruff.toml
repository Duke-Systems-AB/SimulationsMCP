# Ruff config for the Python COM backend. Run: npm run lint:py
target-version = "py39"
line-length = 100

exclude = ["dist", "__pycache__", ".pytest_cache"]

[lint]
# Pyflakes (F) catches the things that actually bite: undefined names, unused
# imports, shadowed bindings. pycodestyle errors (E) catch syntax-adjacent
# problems. Deliberately not enabling import sorting or formatting rules - the
# churn would bury real findings in an 11k-line file.
select = ["E4", "E7", "E9", "F", "B"]
ignore = [
    # Long lines are pervasive in the COM layer (ModL command strings) and
    # wrapping them hurts readability more than it helps.
    "E501",
    # The three below are house style, applied consistently across 11k lines.
    # Enabling them would produce ~60 findings that say nothing about correctness
    # and would bury the F/B rules that do.
    "E401",  # multiple imports on one line
    "E701",  # multiple statements on one line (colon)
    "E702",  # multiple statements on one line (semicolon)
]

[lint.per-file-ignores]
# Tests bind fixtures and fakes that look unused to a static checker, and they
# manipulate sys.path before importing the module under test - which is exactly
# what E402 flags.
"tests/**" = ["F811", "F401", "E402", "E741"]
