[pytest]
# Bare `pytest` runs the offline suite only. The live suite needs a running
# ExtendSim and is opted into explicitly: `pytest tests/live` (an explicit path
# argument overrides testpaths), or `npm run test:live`.
testpaths = tests/unit_py
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    live: requires a running ExtendSim instance (skipped automatically when absent)

# Keep failures readable without drowning in traceback.
addopts = --tb=short -q
